<!DOCTYPE html>
<html>

<head>
    <title>Edit Vegetable</title>

    <style>
        body {
            background: #f5f5f5;
            font-family: Arial;
        }

        .container {
            width: 500px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
            color: #2e7d32;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: orange;
            color: white;
            border: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Edit Vegetable</h1>

        <form method="POST">

            <input type="text" name="name" value="{{ veg.name }}" required>

            <input type="number" name="price" value="{{ veg.price }}" required>

            <input type="text" name="unit" value="{{ veg.unit }}" required>

            <button type="submit">
                Update Vegetable
            </button>

        </form>

    </div>

</body>

</html>
